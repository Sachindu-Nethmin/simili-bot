# Simili-Bot configuration — github_native backend (no Qdrant, no embedding key required)
# GitHub's hybrid search API + in-process BM25 re-ranking handles similarity search.
# Only GITHUB_TOKEN (provided automatically by Actions) and optionally GEMINI_API_KEY
# (for LLM duplicate verdict) are needed.

search:
  backend: github_native   # "github_native" | "bm25" | "qdrant"
  bm25_fallback: true      # fall back to BM25 if GitHub search is rate-limited

workflow: issue-triage-github

llm:
  provider: "gemini"
  api_key: "${GEMINI_API_KEY}"   # Optional — enables LLM duplicate verdict; omit to skip
  model: "gemini-2.5-flash"

defaults:
  # BM25 scores are in [0,1] but typically lower than cosine similarity.
  # 0.10–0.20 is a good starting point; raise if too many false positives.
  similarity_threshold: 0.15
  max_similar_to_show: 3
  duplicate_candidates: 5

transfer:
  enabled: false
