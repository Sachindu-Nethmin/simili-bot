# Simili-Bot — single-repo config using GitHub-native search (zero infrastructure)
# No Qdrant, no embedding API key required. Only GITHUB_TOKEN (automatic in Actions)
# and optionally an LLM key for duplicate verdict.

search:
  backend: github_native   # "github_native" | "bm25" | "qdrant"
  bm25_fallback: true

workflow: issue-triage-github

llm:
  provider: "gemini"       # or "openai"
  api_key: "${GEMINI_API_KEY}"
  model: "gemini-2.5-flash"

defaults:
  similarity_threshold: 0.15  # BM25 scores; raise to 0.25–0.40 if too noisy
  max_similar_to_show: 5
  duplicate_candidates: 5

# --- Qdrant backend (legacy) ---
# To use Qdrant instead, set search.backend: qdrant and uncomment below:
