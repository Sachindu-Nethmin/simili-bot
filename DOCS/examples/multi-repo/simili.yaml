# Simili-Bot — multi-repo config using GitHub-native search (zero infrastructure)
# No Qdrant, no embedding API key required.

search:
  backend: github_native
  bm25_fallback: true

workflow: issue-triage-github

llm:
  provider: "gemini"
  api_key: "${GEMINI_API_KEY}"
  model: "gemini-2.5-flash"

defaults:
  similarity_threshold: 0.15
  max_similar_to_show: 5
  cross_repo_search: true
  duplicate_candidates: 5

repositories:
  - org: "my-org"
    repo: "backend"
    enabled: true
    labels: ["backend"]
  - org: "my-org"
    repo: "frontend"
    enabled: true
    labels: ["frontend"]

# --- Qdrant backend (legacy) ---
# To use Qdrant instead, set search.backend: qdrant and uncomment below:
