# git-cliff configuration — https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented here.\n
Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
versioned with [Semantic Versioning](https://semver.org/).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.id }}))
{% endfor %}\
{% endfor %}\n
"""
trim = true
footer = ""

[remote.github]
owner = ""
repo  = ""
# owner/repo are resolved at runtime from the GITHUB_REPO env var
# (set in the workflow step), so no hardcoded values are needed here.

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
  # Conventional Commits breaking change — `feat!:`, `fix!:`, or BREAKING CHANGE footer
  { message = "^[a-z]+!",           group = "⚠️ Breaking Changes" },
  { body    = ".*BREAKING CHANGE.*", group = "⚠️ Breaking Changes" },
  { message = "^feat",      group = "✨ New Features" },
  { message = "^fix",       group = "🐛 Bug Fixes" },
  { message = "^perf",      group = "⚡ Performance" },
  { message = "^refactor",  group = "🔧 Refactoring" },
  { message = "^test",      group = "🧪 Tests" },
  { message = "^ci",        group = "🔧 Reliability & Maintenance" },
  { message = "^chore",     group = "🔧 Reliability & Maintenance" },
  { message = "^docs",      group = "📚 Documentation" },
  { message = ".*",         group = "🔩 Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0\\.0\\.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
